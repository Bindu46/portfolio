
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calendar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .calendar {
            width: 430px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Header */

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 24px;
            color: #333;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-buttons button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-buttons button:hover {
            background: #4f63d2;
            transform: scale(1.05);
        }

        /* Today Button */

        .today-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #f1f3ff;
            color: #667eea;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .today-btn:hover {
            background: #e1e5ff;
        }

        /* Weekdays */

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }

        .weekdays {
            margin-bottom: 10px;
        }

        .weekdays div {
            font-weight: bold;
            color: #777;
            font-size: 14px;
        }

        /* Days */

        .days div {
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px;
            border-radius: 10px;
            cursor: pointer;
            color: #333;
            transition: 0.2s;
        }

        .days div:hover {
            background: #eef0ff;
            color: #667eea;
        }

        /* Sunday */

        .days .sunday {
            color: #e74c3c;
        }

        /* Today */

        .days .today {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .days .today:hover {
            background: #4f63d2;
            color: white;
        }

        /* Selected date */

        .days .selected {
            border: 2px solid #667eea;
        }

        /* Empty days */

        .days .empty {
            cursor: default;
        }

        .days .empty:hover {
            background: transparent;
        }

        /* Selected date display */

        .selected-date {
            margin-top: 20px;
            text-align: center;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 10px;
            color: #555;
            font-size: 14px;
        }

        /* Mobile */

        @media (max-width: 500px) {
            .calendar {
                width: 100%;
                padding: 18px;
            }

            .calendar-header h2 {
                font-size: 20px;
            }

            .days div {
                height: 42px;
            }
        }
    </style>
</head>

<body>

    <div class="calendar">

        <div class="calendar-header">

            <h2 id="monthYear"></h2>

            <div class="nav-buttons">
                <button onclick="previousMonth()">‹</button>
                <button onclick="nextMonth()">›</button>
            </div>

        </div>

        <button class="today-btn" onclick="goToToday()">
            🏠 Go to Today
        </button>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="days" id="days"></div>

        <div class="selected-date" id="selectedDate">
            Select a date
        </div>

    </div>


    <script>

        // Current date
        const currentDate = new Date();

        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        // Store selected date
        let selectedDay = null;
        let selectedMonth = null;
        let selectedYear = null;


        // Month names
        const monthNames = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];


        // Display calendar
        function displayCalendar() {

            const monthYear = document.getElementById("monthYear");
            const daysContainer = document.getElementById("days");

            // Clear previous days
            daysContainer.innerHTML = "";

            // Display month and year
            monthYear.innerText =
                monthNames[currentMonth] + " " + currentYear;


            // First day of month
            const firstDay =
                new Date(currentYear, currentMonth, 1).getDay();


            // Number of days in month
            const totalDays =
                new Date(currentYear, currentMonth + 1, 0).getDate();


            // Empty spaces before first day
            for (let i = 0; i < firstDay; i++) {

                const emptyDay = document.createElement("div");

                emptyDay.classList.add("empty");

                daysContainer.appendChild(emptyDay);
            }


            // Create days
            for (let day = 1; day <= totalDays; day++) {

                const dayElement =
                    document.createElement("div");

                dayElement.innerText = day;


                // Find day of week
                const dayOfWeek =
                    new Date(
                        currentYear,
                        currentMonth,
                        day
                    ).getDay();


                // Highlight Sunday
                if (dayOfWeek === 0) {
                    dayElement.classList.add("sunday");
                }


                // Highlight today's date
                if (
                    day === currentDate.getDate() &&
                    currentMonth === currentDate.getMonth() &&
                    currentYear === currentDate.getFullYear()
                ) {

                    dayElement.classList.add("today");
                }


                // Highlight selected date
                if (
                    day === selectedDay &&
                    currentMonth === selectedMonth &&
                    currentYear === selectedYear
                ) {

                    dayElement.classList.add("selected");
                }


                // Click event
                dayElement.addEventListener("click", function () {

                    selectedDay = day;
                    selectedMonth = currentMonth;
                    selectedYear = currentYear;

                    displayCalendar();

                    showSelectedDate();

                });


                daysContainer.appendChild(dayElement);
            }
        }


        // Previous month
        function previousMonth() {

            currentMonth--;

            if (currentMonth < 0) {

                currentMonth = 11;
                currentYear--;

            }

            displayCalendar();
        }


        // Next month
        function nextMonth() {

            currentMonth++;

            if (currentMonth > 11) {

                currentMonth = 0;
                currentYear++;

            }

            displayCalendar();
        }


        // Go to today's date
        function goToToday() {

            currentMonth = currentDate.getMonth();
            currentYear = currentDate.getFullYear();

            selectedDay = null;
            selectedMonth = null;
            selectedYear = null;

            displayCalendar();

            document.getElementById("selectedDate").innerText =
                "Today: " +
                currentDate.toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }


        // Show selected date
        function showSelectedDate() {

            const date = new Date(
                selectedYear,
                selectedMonth,
                selectedDay
            );

            document.getElementById("selectedDate").innerText =
                date.toLocaleDateString(
                    "en-IN",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }


        // Load calendar when page opens
        displayCalendar();

    </script>

</body>
</html>
