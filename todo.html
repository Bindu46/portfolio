<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #388e3c;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        li.completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #e53935;
            padding: 7px 10px;
        }

        .delete:hover {
            background: #c62828;
        }

        #count {
            margin-top: 15px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 My To-Do List</h1>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

        <p id="count">Tasks: 0</p>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML = `
                <span onclick="completeTask(this)">
                    ${task}
                </span>

                <button class="delete" onclick="deleteTask(this)">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";

            updateCount();
        }


        function completeTask(element) {
            element.parentElement.classList.toggle("completed");
        }


        function deleteTask(button) {
            button.parentElement.remove();

            updateCount();
        }


        function updateCount() {

            let tasks = document.querySelectorAll("#taskList li");

            document.getElementById("count").innerText =
                "Tasks: " + tasks.length;
        }

    </script>

</body>
</html>
