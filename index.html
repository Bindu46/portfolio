<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <div class="balance-box">
            <h3>Balance</h3>
            <h2 id="balance">₹0</h2>
        </div>

        <div class="summary">

            <div class="income">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="expense">
                <h3>Expense</h3>
                <p id="expense">₹0</p>
            </div>

        </div>

        <h2>Add Transaction</h2>

        <form id="expenseForm">

            <label>Description</label>

            <input
                type="text"
                id="description"
                placeholder="Enter description"
                required
            >

            <label>Amount</label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                required
            >

            <label>Type</label>

            <select id="type">

                <option value="income">Income</option>

                <option value="expense">Expense</option>

            </select>

            <button type="submit">
                Add Transaction
            </button>

        </form>

        <h2>Transactions</h2>

        <ul id="transactionList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
